patch:
  # 通知栏显示方式以及 ascii_mode 应用，与外观无关
  show_notifications_via_notification_center: true

  # 以下软件默认英文模式
  app_options:
    com.github.GitHubClient:
      ascii_mode: false

# 如果想要修改皮肤，直接更改 color_scheme 的值即可
  style:
    color_scheme: macos_light
    color_scheme_dark: macos_dark

  preset_color_schemes:
    macos_light:
      font_face: "PingFangSC"
      font_point: 15.6
      label_font_point: 13.0
      candidate_list_layout: linear
      text_orientation: horizontal
      inline_preedit: true
      translucency: true
      corner_radius: 10.0
      hilited_corner_radius: 8.0
      border_height: -3.0
      border_width: -3.0
      line_spacing: 8.0
      base_offset: 6.0
      shadow_size: 3.0
      color_space: display_p3
      back_color: 0x4CDDDDDD
      candidate_text_color: 0x333333
      comment_text_color: 0x333333
      label_color: 0x5B5B5B
      hilited_candidate_back_color: 0x9A8150
      hilited_candidate_text_color: 0xFFFDFE
      hilited_comment_text_color: 0xFFFDFE
      hilited_candidate_label_color: 0xFFFFFF
      text_color: 0x333333
      hilited_text_color: 0xF7F7F7

    macos_dark:
      font_face: "PingFangSC"
      font_point: 15.6
      label_font_point: 13.0
      candidate_list_layout: linear
      text_orientation: horizontal
      inline_preedit: true
      translucency: true
      corner_radius: 10.0
      hilited_corner_radius: 8.0
      border_height: -3.0
      border_width: -3.0
      line_spacing: 8.0
      base_offset: 6.0
      shadow_size: 3.0
      color_space: display_p3
      back_color: 0x4C747474
      candidate_text_color: 0xFFFFFF
      comment_text_color: 0xF5F5F5
      label_color: 0xDCDCDC
      hilited_candidate_back_color: 0x9A8150
      hilited_candidate_text_color: 0xFFFDFE
      hilited_comment_text_color: 0xF5F5F5
      hilited_candidate_label_color: 0xFFFFFF
      text_color: 0xDDDDDD
      hilited_text_color: 0xFFFFFF

